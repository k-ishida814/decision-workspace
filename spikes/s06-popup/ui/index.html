<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Decision Workspace</title>
    <style>
      :root { color-scheme: light dark; font: 14px -apple-system, system-ui, sans-serif; }
      body { margin: 0; padding: 16px 18px; }
      .origin { opacity: 0.6; font-size: 12px; margin-bottom: 8px; }
      h1 { font-size: 16px; margin: 0 0 12px; }
      .option { display: block; width: 100%; text-align: left; padding: 8px 10px; margin: 4px 0;
        border: 1px solid #8884; border-radius: 6px; background: none; font: inherit; color: inherit; }
      .option.active { border-color: #00a7d6; background: #00a7d61a; }
      .option small { display: block; opacity: 0.65; }
      input { width: 100%; box-sizing: border-box; padding: 8px; font: inherit; margin-top: 8px; }
      .bar { display: flex; gap: 8px; margin-top: 14px; }
      .bar button { font: inherit; }
      .hint { opacity: 0.5; font-size: 11px; margin-top: 10px; }
    </style>
  </head>
  <body>
    <div class="origin" id="origin"></div>
    <h1 id="question">…</h1>
    <div id="options"></div>
    <input id="text" placeholder="Your own answer (o)" />
    <div class="bar">
      <button type="button" id="confirm">Confirm (Enter)</button>
      <button type="button" id="skip">Skip (s)</button>
      <button type="button" id="fallback">Answer in terminal (Esc)</button>
    </div>
    <div class="hint" id="hint"></div>
    <script>
      const { invoke } = window.__TAURI__.core;
      const { listen } = window.__TAURI__.event;
      let questions = [];
      let index = 0;
      let cursor = 0;
      const answers = [];
      const $ = (id) => document.getElementById(id);

      function render() {
        const q = questions[index];
        $("question").textContent = `${q.question}${questions.length > 1 ? `  (${index + 1}/${questions.length})` : ""}`;
        $("options").replaceChildren(
          ...q.options.map((o, i) => {
            const b = document.createElement("button");
            b.className = `option${i === cursor ? " active" : ""}`;
            b.innerHTML = `${i + 1}. ${o.label}${o.description ? `<small>${o.description}</small>` : ""}`;
            b.onclick = () => { cursor = i; confirm(); };
            return b;
          }),
        );
        $("text").value = "";
      }

      function finish(message) {
        invoke("reply", { line: JSON.stringify(message) });
      }
      function confirm() {
        const q = questions[index];
        const text = $("text").value.trim();
        answers.push(text ? { selected: [], text } : { selected: [q.options[cursor]?.label ?? ""] });
        next();
      }
      function next() {
        index++;
        cursor = 0;
        if (index >= questions.length) finish({ type: "answer", answers });
        else render();
      }

      document.addEventListener("keydown", (e) => {
        const typing = document.activeElement === $("text");
        if (e.key === "Escape") return finish({ type: "fallback" });
        if (typing) {
          // Enter while the IME is composing only commits the conversion.
          if (e.key === "Enter" && !e.isComposing) confirm();
          return;
        }
        const q = questions[index];
        if (!q) return;
        if (/^[1-9]$/.test(e.key) && Number(e.key) <= q.options.length) { cursor = Number(e.key) - 1; render(); }
        else if (e.key === "ArrowDown" || e.key === "j") { cursor = Math.min(cursor + 1, q.options.length - 1); render(); }
        else if (e.key === "ArrowUp" || e.key === "k") { cursor = Math.max(cursor - 1, 0); render(); }
        else if (e.key === "Enter") confirm();
        else if (e.key === "o") { e.preventDefault(); $("text").focus(); }
        else if (e.key === "s") { answers.push({ skipped: true }); next(); }
      });
      $("confirm").onclick = confirm;
      $("skip").onclick = () => { answers.push({ skipped: true }); next(); };
      $("fallback").onclick = () => finish({ type: "fallback" });

      listen("message", (event) => {
        const m = JSON.parse(event.payload);
        if (m.type !== "show") return;
        questions = m.questions;
        $("origin").textContent = `${m.origin.project} · session ${m.origin.session} · ${m.origin.at}`;
        $("hint").textContent = m.more ? `${m.more} more waiting` : "";
        render();
        setTimeout(() => invoke("show"), 0); // rAF does not run while the window is hidden
      }).then(() => invoke("ready"));
    </script>
  </body>
</html>
